<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1440px;position:relative;overflow:hidden;font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
.wrap{position:absolute;inset:110px 96px 130px 96px;display:flex;flex-direction:column;justify-content:center}
.foot{position:absolute;left:96px;right:96px;bottom:56px;display:flex;justify-content:space-between;font-size:26px;letter-spacing:2px}
ul{list-style:none;padding:0}
.code{font-family:"SF Mono",Menlo,monospace;white-space:pre-wrap}
table{border-collapse:collapse;width:100%}
/* ===== A: editorial paper ===== */
body.A{background:#efe9dd;color:#1e1b17}
.A .wrap:before{content:"";position:absolute;left:0;right:0;top:-40px;border-top:3px solid #1e1b17}
.A .no{font-family:"Songti SC",serif;font-size:150px;line-height:1;color:#b5452c;font-weight:900;margin-bottom:10px;font-style:italic}
.A .kicker{font-size:30px;letter-spacing:10px;color:#b5452c;margin-bottom:56px;font-weight:600}
.A h1{font-family:"Songti SC",serif;font-size:108px;line-height:1.18;font-weight:900;letter-spacing:-2px}
.A h2{font-family:"Songti SC",serif;font-size:80px;line-height:1.28;font-weight:900;margin-bottom:70px;letter-spacing:-1px}
.A .sub{font-size:40px;line-height:1.7;color:#6a6258;margin-top:64px;border-top:2px solid #1e1b17;padding-top:36px}
.A li{font-size:48px;line-height:1.55;margin-bottom:40px;padding-bottom:40px;border-bottom:1.5px solid #cfc6b5}
.A li:last-child{border-bottom:none}
.A .steps{counter-reset:s}.A .steps li{counter-increment:s}.A .steps li:before{content:counter(s) ".";color:#b5452c;font-family:"Songti SC",serif;font-weight:900;margin-right:20px}
.A .quote{font-family:"Songti SC",serif;font-size:96px;line-height:1.35;font-weight:900;margin-bottom:56px}
.A .quote:before{content:"“";display:block;font-size:200px;line-height:.8;color:#b5452c;height:90px;margin-bottom:20px}
.A .attr{font-size:36px;color:#6a6258}
.A th{background:#1e1b17;color:#efe9dd;padding:26px 24px;text-align:left;font-size:36px;letter-spacing:4px}
.A td{padding:36px 24px;border-bottom:2px solid #cfc6b5;font-size:40px;line-height:1.5}.A td:first-child{white-space:nowrap;font-weight:900;color:#b5452c}
.A .cta{margin-top:70px;font-size:42px;border:3px solid #1e1b17;padding:30px 44px;display:inline-block;font-weight:700}
.A .code{background:#1e1b17;color:#efe9dd;font-size:38px;line-height:1.7;padding:44px 48px}.A .code b{color:#e59a85}
.A .note,.A .note2{margin-top:36px;font-size:38px;color:#6a6258;line-height:1.5}
.A .foot{color:#8a8173}
/* ===== B: swiss black + volt ===== */
body.B{background:#0d0d0d;color:#f4f4f0}
.B .wrap:before{content:"";position:absolute;left:0;top:-50px;width:140px;height:20px;background:#c6ff2e}
.B .no{font-size:34px;letter-spacing:6px;color:#0d0d0d;background:#c6ff2e;display:inline-block;padding:10px 22px;font-weight:800;margin-bottom:44px;align-self:flex-start;font-family:"SF Mono",Menlo,monospace}
.B .kicker{font-size:30px;letter-spacing:8px;color:#c6ff2e;margin-bottom:50px;font-weight:700;font-family:"SF Mono",Menlo,monospace}
.B h1{font-size:112px;line-height:1.12;font-weight:900;letter-spacing:-4px}
.B h1 br+*{}
.B h2{font-size:84px;line-height:1.2;font-weight:900;margin-bottom:64px;letter-spacing:-2px}
.B .sub{font-size:40px;line-height:1.65;color:#9b9b94;margin-top:60px}
.B li{font-size:48px;line-height:1.5;margin-bottom:34px;padding:30px 36px;background:#1a1a1a;border-left:10px solid #c6ff2e}
.B .steps{counter-reset:s}.B .steps li{counter-increment:s}.B .steps li:before{content:"0" counter(s);color:#c6ff2e;font-family:"SF Mono",Menlo,monospace;font-weight:800;margin-right:24px}
.B .quote{font-size:100px;line-height:1.3;font-weight:900;margin-bottom:50px;letter-spacing:-3px;color:#c6ff2e}
.B .attr{font-size:38px;color:#9b9b94}
.B th{background:#c6ff2e;color:#0d0d0d;padding:26px 24px;text-align:left;font-size:36px;font-weight:900}
.B td{padding:36px 24px;border-bottom:2px solid #2b2b2b;font-size:40px;line-height:1.5}.B td:first-child{white-space:nowrap;font-weight:900;color:#c6ff2e}
.B .cta{margin-top:70px;font-size:42px;background:#c6ff2e;color:#0d0d0d;padding:32px 44px;display:inline-block;font-weight:900}
.B .code{background:#1a1a1a;color:#f4f4f0;font-size:38px;line-height:1.7;padding:44px 48px;border-left:10px solid #c6ff2e}.B .code b{color:#c6ff2e}
.B .note,.B .note2{margin-top:36px;font-size:38px;color:#9b9b94;line-height:1.5}
.B .foot{color:#666;font-family:"SF Mono",Menlo,monospace}
/* ===== C: soft gradient glass ===== */
body.C{background:linear-gradient(160deg,#e9e4ff 0%,#ffe4ec 55%,#fff0d9 100%);color:#2a2540}
.C .wrap{background:rgba(255,255,255,.62);border-radius:56px;inset:90px 70px 120px 70px;padding:80px 70px;box-shadow:0 30px 80px rgba(120,100,200,.18)}
.C .no{font-size:36px;font-weight:800;color:#fff;background:linear-gradient(135deg,#7b61ff,#ff7aa8);border-radius:999px;padding:12px 30px;display:inline-block;align-self:flex-start;margin-bottom:44px;letter-spacing:3px}
.C .kicker{font-size:30px;letter-spacing:6px;color:#7b61ff;margin-bottom:46px;font-weight:700}
.C h1{font-size:96px;line-height:1.2;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,#4a2fd1,#e0457b);-webkit-background-clip:text;color:transparent}
.C h2{font-size:72px;line-height:1.3;font-weight:900;margin-bottom:56px}
.C .sub{font-size:38px;line-height:1.7;color:#6c6586;margin-top:56px}
.C li{font-size:44px;line-height:1.5;margin-bottom:26px;padding:26px 34px;background:#fff;border-radius:28px;box-shadow:0 8px 24px rgba(120,100,200,.12)}
.C .steps{counter-reset:s}.C .steps li{counter-increment:s}.C .steps li:before{content:counter(s);display:inline-block;width:56px;height:56px;line-height:56px;text-align:center;border-radius:50%;background:linear-gradient(135deg,#7b61ff,#ff7aa8);color:#fff;font-size:32px;font-weight:800;margin-right:22px}
.C .quote{font-size:84px;line-height:1.35;font-weight:900;margin-bottom:46px;background:linear-gradient(135deg,#4a2fd1,#e0457b);-webkit-background-clip:text;color:transparent}
.C .attr{font-size:36px;color:#6c6586}
.C table{border-radius:28px;overflow:hidden;background:#fff}
.C th{background:linear-gradient(135deg,#7b61ff,#ff7aa8);color:#fff;padding:24px;text-align:left;font-size:34px}
.C td{padding:32px 24px;border-bottom:2px solid #f0ecfa;font-size:38px;line-height:1.5}.C td:first-child{white-space:nowrap;font-weight:800;color:#7b61ff}
.C .cta{margin-top:60px;font-size:40px;background:linear-gradient(135deg,#7b61ff,#ff7aa8);color:#fff;padding:30px 44px;border-radius:999px;display:inline-block;font-weight:800}
.C .code{background:#2a2540;color:#fff;font-size:36px;line-height:1.7;padding:40px;border-radius:28px}.C .code b{color:#ffb3cd}
.C .note,.C .note2{margin-top:30px;font-size:36px;color:#6c6586;line-height:1.5}
.C .foot{color:#8a82a8;left:90px;right:90px}
</style></head><body><div class="wrap" id="c"></div>
<div class="foot"><span>@JackS.u · 爱丁堡 CS</span><span id="pg"></span></div>
<script>
document.body.className=window.THEME||"A";
const S=window.SLIDE;let h="";
const L=a=>a.map(b=>`<li>${b}</li>`).join("");
if(S.type=="cover")h=`<div class=kicker>${S.kicker}</div><h1>${S.heading}</h1><div class=sub>${S.sub}</div>`;
else if(S.type=="content")h=`<div class=no>${S.no}</div><h2>${S.heading}</h2><ul>${L(S.bullets)}</ul>`;
else if(S.type=="quote")h=`<div class=no>${S.no}</div><h2>${S.heading}</h2><div class=quote>${S.quote}</div><div class=attr>${S.bullets[0]}</div>`;
else if(S.type=="table")h=`<div class=no>${S.no}</div><h2>${S.heading}</h2><table><tr>${S.cols.map(c=>`<th>${c}</th>`).join("")}</tr>${S.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
else if(S.type=="steps")h=`<div class=no>${S.no}</div><h2>${S.heading}</h2><ul class=steps>${L(S.bullets)}</ul><div class=note>${S.note||""}</div>`;
else if(S.type=="code")h=`<div class=no>${S.no}</div><h2>${S.heading}</h2><div class=code>${S.code}</div><div class=note2>${S.note||""}</div>`;
else if(S.type=="end")h=`<h1 style="font-size:100px">${S.heading}</h1><div class=sub>${S.sub}</div><div><span class=cta>${S.cta}</span></div>`;
document.getElementById("c").innerHTML=h;document.getElementById("pg").textContent=window.PG;
</script></body></html>
